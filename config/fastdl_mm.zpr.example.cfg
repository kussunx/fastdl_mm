// ReHLDS/ZPR baseline validated with CS 1.6 Steam on Windows x86.
// UDP 27015 (game) and TCP 27015 (FastDL) can coexist. Allow and, for
// external players, forward TCP 27015 separately from UDP 27015.
fastdl_enabled               "1"
fastdl_bind                  "0.0.0.0"
fastdl_port                  "27015"
fastdl_root                  "cstrike"

fastdl_serve_dirs            "sprites,sound,sounds,overviews,models,maps,gfx"
fastdl_serve_types           "bsp,nav,res,wad,mdl,spr,wav,mp3,bmp,tga,txt,htm,html,gz,bz2"
fastdl_serve_root_types      "wad"
fastdl_max_file_mb           "250"

fastdl_threads               "1"
fastdl_max_connections       "64"
fastdl_max_connections_ip    "32"
fastdl_connection_timeout    "30"

fastdl_requests_minute       "500"
fastdl_denials_minute        "36"
fastdl_block_seconds         "180"

// Keep these unlimited until sustained host upload capacity is measured.
// Reserve uplink headroom for ReHLDS rather than choosing values blindly.
fastdl_bandwidth_max_mbps    "0"
fastdl_bandwidth_ip_mbps     "0"

fastdl_steam_only            "1"

fastdl_gzip                  "1"
fastdl_gzip_cache            "1"
fastdl_gzip_cache_path       "fastdl_cache"
fastdl_gzip_cache_max_mb     "256"

// Bind and public URL have different purposes. 0.0.0.0 listens locally;
// put a public IP or hostname in sv_downloadurl/public_url, not fastdl_bind.
fastdl_auto_downloadurl      "0"
fastdl_public_url            ""

fastdl_log                   "logs/fastdl/fastdl.log"
fastdl_log_age               "7"

// Same LAN:  sv_downloadurl "http://SERVER_LAN_IP:27015/"
// External:  sv_downloadurl "http://PUBLIC_IP_OR_HOSTNAME:27015/"
